<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheet viewer — Rechenritter</title>
<style>
  body { background: #151322; color: #f2eefc; font: 14px system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 1rem; margin: 0 0 10px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  select, input { background: #262138; color: inherit; border: 1px solid #3a3355; border-radius: 6px; padding: 5px 8px; }
  .wrap { position: relative; display: inline-block; overflow: auto; max-width: 100%; border: 1px solid #3a3355; }
  canvas { display: block; image-rendering: pixelated; }
  #readout { margin-top: 10px; font-family: ui-monospace, Consolas, monospace; color: #ffd45e; min-height: 3em; white-space: pre; }
  p.hint { color: #a79dc4; max-width: 60ch; line-height: 1.5; }
</style>
</head>
<body>
<h1>Sprite sheet viewer</h1>
<p class="hint">
  Click a tile to get its manifest coordinates. Use this when adding entries to
  <code>assets/sprites/manifest.js</code> or after swapping in a different pack.
  Serve the project (<code>python serve.py</code>) and open
  <code>/tools/sheet-viewer.html</code>.
</p>

<div class="bar">
  <label>Sheet
    <select id="sheet"></select>
  </label>
  <label>Zoom
    <input id="zoom" type="range" min="2" max="10" step="1" value="4">
  </label>
  <span id="dims"></span>
</div>

<div class="wrap"><canvas id="canvas"></canvas></div>
<div id="readout">Click a tile.</div>

<script type="module">
import { SHEETS, TILE, PLAYERS, ENEMIES } from '../assets/sprites/manifest.js';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const sheetSelect = document.getElementById('sheet');
const zoom = document.getElementById('zoom');
const readout = document.getElementById('readout');
const dims = document.getElementById('dims');

// Reverse lookup so a clicked tile can name what already uses it.
const byTile = {};
for (const [group, table] of [['PLAYERS', PLAYERS], ['ENEMIES', ENEMIES]]) {
  for (const [id, def] of Object.entries(table)) {
    const key = def.sheet + ':' + def.col + ',' + def.row;
    (byTile[key] = byTile[key] || []).push(group + ' ' + id + ' (' + def.name + ')');
  }
}

for (const key of Object.keys(SHEETS)) {
  const option = document.createElement('option');
  option.value = key;
  option.textContent = key;
  sheetSelect.appendChild(option);
}

let image = null;
let current = sheetSelect.value;

function draw() {
  if (!image) return;
  const scale = Number(zoom.value);
  const sheet = SHEETS[current];
  canvas.width = image.width * scale;
  canvas.height = image.height * scale;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#1e1b30';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

  const step = TILE * scale;
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.font = '10px monospace';
  ctx.fillStyle = 'rgba(255,212,94,0.9)';
  for (let c = 0; c <= sheet.cols; c++) {
    ctx.beginPath(); ctx.moveTo(c * step, 0); ctx.lineTo(c * step, canvas.height); ctx.stroke();
  }
  for (let r = 0; r <= sheet.rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, r * step); ctx.lineTo(canvas.width, r * step); ctx.stroke();
    for (let c = 0; c < sheet.cols; c++) ctx.fillText(c + ',' + r, c * step + 2, r * step + 10);
  }
  dims.textContent = image.width + '×' + image.height + ' px — '
    + sheet.cols + ' × ' + sheet.rows + ' tiles';
}

function load() {
  current = sheetSelect.value;
  image = new Image();
  image.onload = draw;
  image.onerror = () => { readout.textContent = 'Could not load ' + SHEETS[current].file; };
  image.src = '../' + SHEETS[current].file;
}

canvas.addEventListener('click', (ev) => {
  const scale = Number(zoom.value);
  const rect = canvas.getBoundingClientRect();
  const col = Math.floor((ev.clientX - rect.left) / (TILE * scale));
  const row = Math.floor((ev.clientY - rect.top) / (TILE * scale));
  const used = byTile[current + ':' + col + ',' + row];
  readout.textContent =
    "{ name: '?', sheet: '" + current + "', col: " + col + ', row: ' + row + ' }\n'
    + (used ? 'already used by: ' + used.join(', ') : 'not used yet');
});

sheetSelect.addEventListener('change', load);
zoom.addEventListener('input', draw);
load();
</script>
</body>
</html>
